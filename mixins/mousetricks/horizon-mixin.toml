[mod]
id = "mousetricks"
version = "0.2.1"
priority = 100

# Pinned: the two hooks marked "pinned" below target game functions that are
# not native hook points (the hook points that hear the drag and the wheel
# over a screen, `screen_mouse_dragged_pre` and `screen_mouse_scrolled_pre`,
# only read the game, and a drag or a wheel move here clicks slots), so the
# mod is made for this one commit. Every other hook names a hook point
# (`hook`, resolved from the source's native-hooks.json; NATIVE_HOOKS_API
# 114). Each pinned target is free of macros and cfg, as horizon-mixins
# requires of a HEAD target.
[compatibility]
horizon_revision = "36584650eaeec33553d41c4551a5b38b4a6cd0d7"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mousetricks"
source = "runtime.rs"

[[module]]
id = "native"
file = "crates/horizon-client/src/game.rs"
name = "mousetricks_native"
source = "native.rs"

# Hook point (API 114): a window mouse button going down or up, on any
# screen, before the game dispatches it. A left or right press goes on (the
# drag it may start is noted); a middle click on an empty spot sorts and is
# cancelled (the game's own sort button answers "handled" the same way). A
# release ends the drag and goes on.
[[injection]]
id = "button"
hook = "mouse_button_pre"
hook_version = 1
kind = "HEAD"
helper = "button.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "i32", value = "button" },
  { name = "pressed", ty = "bool", value = "pressed" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Pinned: the cursor moving over an inventory screen; Mouse Tricks' drags take
# the move (the game's quick craft drag then doesn't grow).
[[injection]]
id = "drag"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::inventory_input::Game<'_>::inventory_drag_move"
helper = "drag.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Pinned: the wheel over an inventory screen moves items one by one.
[[injection]]
id = "wheel"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::tweaks::Game<'_>::tweak_scroll"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "delta", ty = "f32", value = "delta" },
  { name = "slot", ty = "Option<usize>", value = "slot" },
]

# Hook point: a drag whose release went to another screen ends; a paced sort
# (on a server) makes its next clicks.
[[injection]]
id = "frame"
kind = "HEAD"
hook = "frame"
hook_version = 1
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

# Hook point: the sort key over an inventory screen (keys reach it on any
# screen).
[[injection]]
id = "key"
kind = "HEAD"
hook = "key"
hook_version = 1
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# Hook points: the row in Options > Mods and its settings page.
[[injection]]
id = "list"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
hook = "settings"
hook_version = 1
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
hook = "settings_click"
hook_version = 1
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
